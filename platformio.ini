# PlatformIO Configuration for ESP8266 WiFi Repeater
# Professional build system with multiple environments

[platformio]
default_envs = esp8266_debug
src_dir = user
include_dir = include
lib_dir = .
build_dir = .pio/build
data_dir = web

[env]
# Base environment settings for all builds
platform = espressif8266@3.2.0
framework = esp8266-rtos-sdk
board = esp8266
monitor_speed = 115200
monitor_port = /dev/ttyUSB0

# Build settings
board_build.flash_mode = dio
board_build.flash_size = 32m
board_build.flash_freq = 40m
board_build.ldscript_path = user/eagle.app.v6.ld

# Common build flags
build_flags =
    -DICACHE_FLASH
    -DLWIP_OPEN_SRC
    -DUSE_OPTIMIZE_PRINTF
    -D__ets__
    -Wpointer-arith
    -Wundef
    -Werror
    -Wl,-EL
    -fno-inline-functions
    -nostdlib
    -mlongcalls
    -mtext-section-literals

# Common library dependencies
lib_deps =
    # SDK libraries handled via liblwip_open_napt.a

# Common upload settings
upload_speed = 115200

[env:esp8266_debug]
# Debug build with optimizations
description = ESP8266 Debug Build (Optimized)
build_type = debug
build_flags =
    ${env.build_flags}
    -g
    -O2
    -DDEBUG_MODE=1

[env:esp8266_release]
# Release build with minimal size
description = ESP8266 Release Build (Minimal)
build_type = release
build_flags =
    ${env.build_flags}
    -Os
    -s
    -DDEBUG_MODE=0

[env:esp8266_production]
# Production build with all features and bridge mode
description = ESP8266 Production Build (Full Features)
build_type = release
build_flags =
    ${env.build_flags}
    -Os
    -s
    -DPRODUCTION_BUILD=1
    -DBRIDGE_MODE_ENABLED=1
    -DFEATURE_WEB_UI=1
    -DFEATURE_TUNING=1

[env:esp8266_fast]
# Fast build for rapid development/testing
description = ESP8266 Fast Build (Development)
build_type = debug
build_flags =
    ${env.build_flags}
    -O0
    -g
    -DFAST_BUILD=1

# Upload via serial
[upload_port]
protocol = esptool
speed = 115200
